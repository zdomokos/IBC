# IBC configuration for the user 'bob'.
#
# Copy this file to %USERPROFILE%\Documents\IBC\config-bob.ini (an encrypted
# folder is best, because it holds a password) and fill in the credentials.
# Then:
#
#   ibc.ps1 start bob       start TWS for bob
#   ibc.ps1 stop bob        shut it down
#
# Only the settings that must differ between instances are set here. Every
# other setting takes its default, which is the value shown in the full
# config.ini, where each setting is described. Add any other settings you need
# from that file.


# The IBKR username and password for this instance. Each username can only be
# logged in once at a time.

IbLoginId=
IbPassword=


# This instance's own TWS settings folder: instances running at the same time
# need different ones. It is created on first use. Leave IbDir empty: if it
# differed, auto-restart would fail.

TwsSettingsPath=C:\\Jts\\bob
IbDir=


# The port that API programs connect to. Every TWS instance running at the same
# time needs a different port.

OverrideTwsApiPort=7502


# The port for IBC commands such as 'ibc.ps1 stop bob'. Every instance needs
# a different port. Set to 0 to disable commands.

CommandServerPort=7472


# The full config.ini sets this to 'no', which differs from IBC's built-in
# default of 'yes', so it's set here to behave the same as a copy of that file.

AcceptNonBrokerageAccountWarning=no
